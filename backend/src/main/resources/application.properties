# Application Configuration
spring.application.name=hvac-iot-monitoring

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hvac_iot
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=hvac-iot-super-secret-key-that-is-at-least-256-bits-long-for-security
jwt.expiration=86400000

# MQTT Configuration (Mosquitto)
mqtt.broker.url=tcp://trolley.proxy.rlwy.net:26703
mqtt.username=generator-monitoring-system
mqtt.password=di1u5ydet0z049vbbl08cofp6vhya45l
mqtt.client.id=hvac-iot-backend

# Mail Configuration (for password reset)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL (for password reset links)
app.frontend.url=http://localhost:5173

# Logging
logging.level.com.hvac.iot=INFO
logging.level.org.eclipse.paho=WARN
logging.level.org.hibernate.SQL=WARN

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
